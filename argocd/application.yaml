apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: demo-service
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/Nithinks654/devops-eks-platform.git
    targetRevision: feature/argocd-gitops
    path: gitops/dev

  destination:
    server: https://kubernetes.default.svc
    namespace: demo

  ignoreDifferences:
    - group: apps
      kind: Deployment
      name: demo-service
      namespace: demo
      jsonPointers:
        - /spec/replicas

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
