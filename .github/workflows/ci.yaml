
name: DevOps CI Pipeline

on:
  push:
    branches:
      - develop
      - main

  pull_request:
    branches:
      - develop
      - main

permissions:
  contents: read

env:
  AWS_REGION: ap-southeast-2
  AWS_ACCOUNT_ID: "625527690351"
  ECR_REPOSITORY: demo-service

jobs:

  # JOB 1: Maven Build, Unit Testing and SonarQube

  build-and-test:
    name: Maven Build and SonarQube
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout source code
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Maven build and unit tests
        working-directory: app
        run: mvn -B clean verify

      - name: SonarQube analysis
        if: github.event_name == 'push'
        working-directory: app
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          mvn -B
          org.sonarsource.scanner.maven:sonar-maven-plugin:5.5.0.6356:sonar
          -Dsonar.qualitygate.wait=true

  # JOB 2: Docker Build and Trivy Security Scan

  docker-security:
    name: Docker Build and Trivy Scan
    runs-on: ubuntu-24.04
    needs: build-and-test

    steps:
      - name: Checkout source code
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./app
          push: false
          load: true
          tags: demo-service:${{ github.sha }}

      - name: Scan image using Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: demo-service:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          exit-code: '1'

  # JOB 3: Publish Docker Image to Amazon ECR

  publish-to-ecr:
    name: Publish Docker Image to ECR
    runs-on: ubuntu-24.04

    needs:
      - build-and-test
      - docker-security

    if: github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')

    steps:
      - name: Checkout source code
        uses: actions/checkout@v5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./app
          push: true
          tags: |
            ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
            ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY }}:latest

