
name: DevOps CI Pipeline

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    name: Maven Build and SonarQube
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Maven build and unit tests
        working-directory: app
        run: mvn -B clean verify

      - name: SonarQube analysis
        if: github.event_name == 'push'
        working-directory: app
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          mvn -B
          org.sonarsource.scanner.maven:sonar-maven-plugin:5.5.0.6356:sonar
          -Dsonar.qualitygate.wait=true

  docker-security:
    name: Docker Build and Trivy Scan
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./app
          push: false
          load: true
          tags: demo-service:${{ github.sha }}

      - name: Scan image using Trivy
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: demo-service:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          exit-code: '1'

  publish-to-ecr:
    name: Publish Docker Image to ECR
    runs-on: ubuntu-latest
    needs:
      - build-and-test
      - docker-security

    if: github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image to ECR
        uses: docker/build-push-action@v6
        with:
          context: ./app
          push: true
          tags: |
            625527690351.dkr.ecr.ap-southeast-2.amazonaws.com/demo-service:${{ github.sha }}
            625527690351.dkr.ecr.ap-southeast-2.amazonaws.com/demo-service:latest
